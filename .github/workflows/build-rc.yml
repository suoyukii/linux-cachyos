name: Build and lint - RC
on:
  workflow_dispatch:

env:
  CCACHE_DIR: /home/builder/.ccache

jobs:
  build:
    name: linux-cachyos-rc
    strategy:
      matrix:
        toolchain: [clang]

    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup build environment
      run: |
          # 1. 初始化 keyring，并完整升级 Arch 基础系统（同时安装 curl、gnupg）
          #    使用 -Syu 而非 -Sy，避免部分升级导致 openssl 依赖断裂
          pacman-key --init
          pacman -Syu --noconfirm --needed curl gnupg

          # 2. 通过 HTTPS 直接下载 CachyOS 仓库签名密钥并导入
          curl -fsSL "https://keys.openpgp.org/vks/v1/by-fingerprint/882DCFE48E2051D48E2562ABF3B607488DB35A47" -o /tmp/cachyos.gpg
          pacman-key --add /tmp/cachyos.gpg
          pacman-key --lsign-key 882DCFE48E2051D48E2562ABF3B607488DB35A47

          # 3. 密钥就位后，再写入 CachyOS 仓库配置
          cat << 'EOF' >> /etc/pacman.conf
          [cachyos]
          Server = https://mirror.cachyos.org/repo/x86_64/cachyos
          EOF

          # 4. 再次完整升级，同步 CachyOS 仓库并安装其余构建依赖
          pacman -Syu --noconfirm --needed ccache pahole

          # Setup builder user
          useradd builder -m
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chmod -R a+rw .
          # Use all threads for building
          sed -i 's/#MAKEFLAGS="-j2"/MAKEFLAGS="-j$(nproc) -l$(nproc)"/g' /etc/makepkg.conf
          # Setup a packager name to indicate that kernel has built with CI
          sed -i 's/#PACKAGER=".*"/PACKAGER="CachyOS GitHub Actions <ci@cachyos.org>"/g' /etc/makepkg.conf
          # Setup ccache
          sed -i 's|!ccache|ccache|' /etc/makepkg.conf
          sudo -u builder mkdir -p ${{ env.CCACHE_DIR }}
    - name: Import CachyOS kernel signing key
      run: |
          # 正确的源码包签名密钥指纹为 C8A2A4774B8B63C4
          sudo -u builder gpg --keyserver hkps://keys.openpgp.org --recv-keys C8A2A4774B8B63C4
    - name: Setup ccache
      id: cache
      uses: actions/cache@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ matrix.toolchain }}-${{ github.run_id }}
        restore-keys: |
          ccache-${{ matrix.toolchain }}
    - name: Build package (${{ matrix.toolchain }})
      id: makepkg
      env:
        _build_nvidia_open: yes
        _use_llvm_lto: thin
      run: |
          cd "linux-cachyos-rc"
          sudo -H -E -u builder makepkg --skipchecksums --syncdeps --noconfirm
    - name: Upload package to artifacts
      id: upload
      uses: actions/upload-artifact@v4
      with:
        name: linux-cachyos-rc-${{ matrix.toolchain }}
        path: linux-cachyos-rc/*.pkg.tar.zst*
