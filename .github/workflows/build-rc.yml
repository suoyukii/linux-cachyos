name: Build and lint - RC
on:
  workflow_dispatch:

env:
  CCACHE_DIR: /home/builder/.ccache

jobs:
  build:
    name: linux-cachyos-rc
    strategy:
      matrix:
        toolchain: [clang]

    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup build environment
      run: |
          # Use CachyOS repository
          cat << 'EOF' >> /etc/pacman.conf
          [cachyos]
          Server = https://mirror.cachyos.org/repo/x86_64/cachyos
          EOF

          pacman-key --init
          pacman-key --recv-keys F3B607488DB35A47 --keyserver keyserver.ubuntu.com
          pacman-key --lsign-key F3B607488DB35A47
          pacman -Syu --noconfirm --needed ccache gnupg pahole

          # Setup builder user
          useradd builder -m
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chmod -R a+rw .

          # Use all threads for building
          sed -i 's/#MAKEFLAGS="-j2"/MAKEFLAGS="-j$(nproc) -l$(nproc)"/g' /etc/makepkg.conf

          # Setup a packager name to indicate that kernel has built with CI
          sed -i 's/#PACKAGER=".*"/PACKAGER="CachyOS GitHub Actions <ci@cachyos.org>"/g' /etc/makepkg.conf

          # Setup ccache
          sed -i 's|!ccache|ccache|' /etc/makepkg.conf
          sudo -u builder mkdir -p ${{ env.CCACHE_DIR }}
    - name: Import CachyOS kernel signing key
      run: |
          sudo -u builder gpg --batch --keyserver hkps://keys.openpgp.org --recv-keys C3C4820857F654FE
    - name: Setup ccache
      id: cache
      uses: actions/cache@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ matrix.toolchain }}-${{ github.run_id }}
        restore-keys: |
          ccache-${{ matrix.toolchain }}
    - name: Build package (${{ matrix.toolchain }})
      id: makepkg
      env:
        _build_nvidia_open: yes
        _use_llvm_lto: thin
      run: |
          cd "linux-cachyos-rc"
          sudo -H -E -u builder makepkg --skipchecksums --syncdeps --noconfirm
    - name: Upload package to artifacts
      id: upload
      uses: actions/upload-artifact@v4
      with:
        name: linux-cachyos-rc-${{ matrix.toolchain }}
        path: linux-cachyos-rc/*.pkg.tar.zst*
